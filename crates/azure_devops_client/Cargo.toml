[package]
name = "azure_devops_client"
description = "HTTP client and trait abstraction for the Azure DevOps REST API (work items, projects, comments). Supports cloud and on-prem TFS with retry, fallback, and custom CA certificates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
schemars = { version = "1.2.3", features = ["derive"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
async-trait = "0.1.92"
rand = "0.10.3"
tokio = { version = "1.53.3", features = ["time", "macros", "rt-multi-thread"] }
url = "2.5.8"
azure_devops_rust_api = { version = "0.39.1", features = ["wit", "core"] }
azure_core = "1.1.0"
# Small deps used for on-prem fallback requests
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json"] }

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
