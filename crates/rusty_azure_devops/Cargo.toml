[package]
name = "rusty_azure_devops"
description = "MCP server and CLI for Azure DevOps (cloud and on-prem TFS) — proxies work item, project, query, and comment operations through the REST API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "ado-mcp"
path = "src/main.rs"

[[bin]]
name = "ado-cli"
path = "src/bin/cli.rs"

[dependencies]
rmcp = { version = "3.2.0", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
azure_devops_client = { path = "../azure_devops_client" }
tokio = { version = "1.53.1", features = ["sync", "rt-multi-thread", "macros"] }
htmd = "0.5.5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
url = "2.5.8"


[dev-dependencies]
rmcp = { version = "3.2.0", features = [
    "client",
    "transport-child-process",
    "transport-io",
] }
async-trait = "0.1.92"
jsonschema = "0.53.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
