[workspace]
members = ["crates/azure_devops_client", "crates/rusty_azure_devops"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/<your-org>/rusty_azure_devops"
homepage = "https://github.com/<your-org>/rusty_azure_devops"
readme = "README.md"
keywords = ["azure-devops", "mcp", "cli", "work-items", "tfs"]
categories = ["api-bindings", "development-tools", "asynchronous"]
publish = false

[workspace.metadata]
name = "rusty-azure-devops"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
