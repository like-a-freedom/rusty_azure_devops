name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug mode
        required: false
        default: false

jobs:
  checks:
    name: Checks (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache: true

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all --no-fail-fast



      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate coverage (llvm-cov)
        if: runner.os == 'Linux'
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./lcov.info
          flags: coverage
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build_binaries:
    name: Build ${{ matrix.platform.os_name }}
    if: github.event_name == 'release'
    needs: checks
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os_name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os_name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Rust toolchain (with cache)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: clippy
          cache: true
          cache-workspaces: true
          target: ${{ matrix.platform.target }}

      - name: Cache target directory
        uses: actions/cache@v6.1.0
        with:
          path: target/${{ matrix.platform.target }}
          key: ${{ runner.os }}-cargo-target-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binaries
        run: cargo build -p rusty_azure_devops --release --target ${{ matrix.platform.target }}

      # The package ships two binaries (ado-mcp, ado-cli); publish both.
      - name: Prepare artifacts (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          mkdir -p app
          for b in ado-mcp ado-cli; do
            out="app/${b}_${{ matrix.platform.suffix }}"
            cp "target/${{ matrix.platform.target }}/release/$b" "$out"
            shasum -a 256 "$out" | cut -d ' ' -f 1 > "$out.sha256"
          done

      - name: Prepare artifacts (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app | Out-Null
          foreach ($b in @('ado-mcp', 'ado-cli')) {
            $out = "app/${b}_${{ matrix.platform.suffix }}.exe"
            Copy-Item "target/${{ matrix.platform.target }}/release/$b.exe" $out
            (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower() | Out-File -Encoding ascii "$out.sha256"
          }

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: app/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_docker_images:
    name: Build Docker images
    if: github.event_name == 'release'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/rusty-azure-devops:latest
            ghcr.io/${{ github.repository_owner }}/rusty-azure-devops:${{ github.ref_name }}
